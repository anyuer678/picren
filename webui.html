<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicRename AI · 图片批量 AI 重命名</title>
<style>
/* ============ 设计令牌（kb-ui 风格） ============ */
:root {
  --kb-color-primary:#7c6f64; --kb-color-success:#8a9a5b; --kb-color-warning:#c8a45d;
  --kb-color-danger:#a05d5d; --kb-color-info:#6d7a83;
  --kb-color-bg:#f4f1ea; --kb-color-bg-elevated:#ebe6db; --kb-color-border:#ddd6c8;
  --kb-color-text-1:#3d3832; --kb-color-text-2:#6b655b; --kb-color-text-3:#a8a094;
  --kb-radius-sm:2px; --kb-radius-md:4px; --kb-radius-lg:6px; --kb-radius-round:0;
  --kb-shadow-1:0 1px 4px rgb(61 56 50/8%); --kb-shadow-2:0 6px 20px rgb(61 56 50/12%);
  --kb-font:"Noto Serif SC","Songti SC","Hiragino Mincho ProN",serif;
  --kb-mono:"Cascadia Code",Consolas,"Courier New",monospace;
  --kb-space-1:4px; --kb-space-2:8px; --kb-space-3:12px; --kb-space-4:16px; --kb-space-5:20px; --kb-space-6:24px;
}
/* ============ 组件基座 ============ */
*{box-sizing:border-box}
body{margin:0;background:var(--kb-color-bg);color:var(--kb-color-text-1);font:15px/1.6 var(--kb-font);transition:background .2s,color .2s}
.wrap{max-width:960px;margin:0 auto;padding:var(--kb-space-6) var(--kb-space-5) 80px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:var(--kb-space-4);flex-wrap:wrap}
header h1{margin:0;font-size:21px;font-weight:600}
header small{color:var(--kb-color-text-3);font-size:12.5px}
.card{background:var(--kb-color-bg-elevated);border:1px solid var(--kb-color-border);border-radius:var(--kb-radius-lg);padding:var(--kb-space-4);margin-bottom:var(--kb-space-4)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{font-size:12.5px;color:var(--kb-color-text-2);display:flex;align-items:center;gap:6px}
input,select,button{font-size:13.5px;padding:8px 11px;border:1px solid var(--kb-color-border);border-radius:var(--kb-radius-md);background:var(--kb-color-bg);color:var(--kb-color-text-1);font-family:inherit;transition:border-color .15s}
input[type=text],input[type=password]{min-width:220px}
input:focus,select:focus{outline:none;border-color:var(--kb-color-primary)}
button{cursor:pointer;border:1px solid var(--kb-color-primary);color:var(--kb-color-primary);background:var(--kb-color-bg)}
button:hover{border-color:var(--kb-color-primary);background:color-mix(in srgb,var(--kb-color-primary) 6%,transparent)}
button.primary{background:var(--kb-color-primary);color:var(--kb-color-bg);border-color:var(--kb-color-primary);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.danger{border-color:var(--kb-color-danger);color:var(--kb-color-danger)}
button.danger:hover{background:color-mix(in srgb,var(--kb-color-danger) 6%,transparent)}
button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px;font-family:var(--kb-mono)}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--kb-color-border);word-break:break-all}
th{color:var(--kb-color-text-3);font-weight:500}
.dir{color:var(--kb-color-primary);cursor:pointer;font-weight:600}
.img{cursor:default}
.bar{height:4px;background:var(--kb-color-border);border-radius:2px;margin:8px 0;overflow:hidden}
.bar>div{height:100%;background:var(--kb-color-primary);transition:width .4s}
#status{color:var(--kb-color-text-2);font-size:13px}
#err{color:var(--kb-color-danger);font-size:13px;white-space:pre-wrap}
#planbox{display:none}
.entries{max-height:260px;overflow:auto;margin-top:8px;border:1px solid var(--kb-color-border);border-radius:var(--kb-radius-md);padding:4px}
.entries>div{padding:3px 8px;border-radius:var(--kb-radius-sm);font-size:13.5px}
.entries>div:hover{background:color-mix(in srgb,var(--kb-color-primary) 6%,transparent)}
.panel-head{font-size:12.5px;color:var(--kb-color-text-3);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;font-weight:500}
.sec{margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <header>
      <h1>PicRename AI <small>图片批量 AI 重命名（本地服务，请勿暴露公网）</small></h1>
    </header>
      </div>

  <div class="card">
    <div class="panel-head">目录</div>
    <div class="row">
      <input type="text" id="dir" placeholder="图片目录，例如 D:\photos\2026" style="flex:1">
      <button onclick="listDir()">浏览目录</button>
      <button onclick="listDir(parentDir)" disabled id="upbtn">上级</button>
    </div>
    <div class="row sec">
      <span id="status">未选择目录</span>
    </div>
    <div id="entries" class="entries"></div>
  </div>

  <div class="card">
    <div class="panel-head">识别与命名</div>
    <div class="row">
      <label>模板 <input type="text" id="template" value="{date}_{category}_{subject}_{index}.{ext}" size="30"></label>
      <label>并发 <input type="number" id="workers" value="4" min="1" max="16" style="width:64px"></label>
      <label><input type="checkbox" id="recursive"> 递归子目录</label>
      <label><input type="checkbox" id="move"> 按类别分目录</label>
      <label><input type="checkbox" id="keep" checked> 保留原名</label>
    </div>
    <div class="row sec">
      <label>API Key <input type="password" id="apikey" placeholder="留空则用环境变量" style="min-width:200px"></label>
      <label>API Base <input type="text" id="apibase" placeholder="https://api.example.com/v1" size="26"></label>
      <label>模型 <input type="text" id="model" value="qwen-vl-max" size="14"></label>
    </div>
    <div class="row sec">
      <button class="primary" onclick="doPreview()">识别并预览</button>
      <button class="danger" onclick="doExecute()">确认执行改名</button>
      <button onclick="doTags()">生成 tags.csv</button>
      <button onclick="doUndo()">回滚上次改名</button>
      <button onclick="loadSample()">加载示例 sample</button>
    </div>
    <div id="err" class="sec"></div>
  </div>

  <div class="card" id="planbox">
    <div class="row"><b>计划（dry-run，未修改文件）</b><span id="stat"></span></div>
    <div id="bar" class="bar"><div id="barfill" style="width:0%"></div></div>
    <table id="plan"><thead><tr><th>原文件名</th><th>新文件名</th></tr></thead><tbody></tbody></table>
  </div>
</div>

<script>
let parentDir = "";
function $(id){return document.getElementById(id)}
function setStatus(s){$("status").textContent=s}
function setErr(s){$("err").textContent=s||""}

function form() {
  return {
    dir: $("dir").value.trim(),
    template: $("template").value.trim(),
    workers: parseInt($("workers").value||"4",10),
    recursive: $("recursive").checked,
    move_by_category: $("move").checked,
    keep_original: $("keep").checked,
    api_key: $("apikey").value.trim(),
    api_base: $("apibase").value.trim(),
    model: $("model").value.trim()
  };
}

async function post(path, data) {
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(data)});
  return r.json();
}

async function listDir(path) {
  const p = path || $("dir").value.trim();
  if (!p) { setErr("请先输入目录路径"); return; }
  setStatus("加载 " + p + " ...");
  const data = await (await fetch("/api/list?path=" + encodeURIComponent(p))).json();
  if (!data.ok) { setErr(data.error); setStatus(""); return; }
  parentDir = data.parent;
  $("upbtn").disabled = !data.parent;
  $("dir").value = data.path;
  setStatus(data.path + "（图片 " + data.image_count + " 张）");
  setErr("");
  const box = $("entries");
  box.innerHTML = "";
  for (const e of data.entries) {
    const div = document.createElement("div");
    div.className = e.is_dir ? "dir" : (e.is_image ? "img" : "");
    div.textContent = (e.is_dir ? "▸ " : "") + e.name;
    if (e.is_dir) div.onclick = () => listDir(data.path + "\\" + e.name);
    box.appendChild(div);
  }
}

function renderPlan(data) {
  const box = $("planbox"), tbody = $("plan").querySelector("tbody");
  box.style.display = "block";
  tbody.innerHTML = "";
  $("stat").textContent = `收集 ${data.total} 张，识别成功 ${data.recognized} 张` +
    (data.failed.length ? `，失败 ${data.failed.length} 张` : "") + `，耗时 ${data.elapsed_s}s`;
  $("barfill").style.width = data.total ? Math.round(data.recognized/data.total*100) + "%" : "0%";
  if (data.failed.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 2;
    td.style.color = "var(--kb-color-danger)";
    td.textContent = "识别失败：" + data.failed.map(f => f[0] + " (" + f[1] + ")").join("；");
    tr.appendChild(td); tbody.appendChild(tr);
  }
  for (const it of data.planned) {
    const tr = document.createElement("tr");
    const a = document.createElement("td"); a.textContent = it.src;
    const b = document.createElement("td"); b.textContent = it.dst;
    tr.appendChild(a); tr.appendChild(b);
    tbody.appendChild(tr);
  }
  if (!data.planned.length && !data.failed.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td"); td.colSpan = 2; td.textContent = "（无匹配文件）";
    tr.appendChild(td); tbody.appendChild(tr);
  }
}

async function doPreview() {
  setErr("");
  const f = form();
  if (!f.dir) { setErr("请先输入目录"); return; }
  setStatus("正在识别 " + f.dir + " ...");
  const data = await post("/api/preview", f);
  if (!data.ok) { setErr(data.error); setStatus(""); return; }
  renderPlan(data);
  setStatus("预览完成");
}

async function doExecute() {
  setErr("");
  const f = form();
  if (!f.dir) { setErr("请先输入目录"); return; }
  if (!confirm("将真实改名该目录下的图片（可回滚）。确认继续？")) return;
  setStatus("正在执行改名 ...");
  f.confirm = "yes";
  const data = await post("/api/execute", f);
  if (!data.ok) { setErr(data.error); setStatus(""); return; }
  setStatus(`执行完成：已重命名 ${data.renamed} 个` + (data.failed.length ? `，失败 ${data.failed.length} 个` : ""));
  if (data.failed.length) setErr("失败：" + data.failed.map(x => x[0] + " (" + x[1] + ")").join("；"));
  await listDir(f.dir);
}

async function doUndo() {
  setErr("");
  const f = form();
  if (!f.dir) { setErr("请先输入目录"); return; }
  if (!confirm("将回滚该目录下最近一次改名的所有文件。确认继续？")) return;
  const data = await post("/api/undo", f);
  if (!data.ok) { setErr(data.error); return; }
  setStatus(`回滚完成：恢复 ${data.renamed} 个` + (data.failed.length ? `，失败 ${data.failed.length} 个` : ""));
  if (data.failed.length) setErr("失败：" + data.failed.map(x => x[0] + " (" + x[1] + ")").join("；"));
  await listDir(f.dir);
}

async function doTags() {
  setErr("");
  const f = form();
  if (!f.dir) { setErr("请先输入目录"); return; }
  setStatus("正在生成标签清单 ...");
  const data = await post("/api/tags", f);
  if (!data.ok) { setErr(data.error); setStatus(""); return; }
  setStatus(`已生成 ${data.path}（${data.rows} 行）`);
}

function loadSample() {
  $("dir").value = "sample";
  listDir();
}
</script>
</body>
</html>
