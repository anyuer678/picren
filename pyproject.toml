[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "picren-ai"
version = "0.1.1"
description = "图片批量 AI 重命名/整理器：AI 看图、改名、归档一条龙"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "Pillow>=12.3.0",
    "httpx>=0.25",
]

[project.scripts]
picren = "picren.main:main"

[tool.setuptools]
packages = ["picren"]
include-package-data = true

[tool.setuptools.package-data]
picren = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]